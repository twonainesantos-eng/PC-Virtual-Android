Código Completo (lc3_vm.c)
c
#include <stdio.h>
#include <stdlib.h>
#include <stdint.h>
#include <string.h>
#include <signal.h>
#include <unistd.h>
#include <fcntl.h>
#include <sys/time.h>
#include <sys/types.h>
#include <sys/termios.h>

/* Registradores da LC-3 */
enum {
    R_R0 = 0, R_R1, R_R2, R_R3, R_R4, R_R5, R_R6, R_R7,
    R_PC, /* Program Counter */
    R_COND,
    R_COUNT
};

/* Opcodes de Instrução */
enum {
    OP_BR = 0, OP_ADD, OP_LD, OP_ST, OP_JSR, OP_AND, OP_LDR, OP_STR,
    OP_RTI, OP_NOT, OP_LDI, OP_STI, OP_JMP, OP_RES, OP_LEA, OP_TRAP
};

/* Condition Flags */
enum { FL_POS = 1 << 0, FL_ZRO = 1 << 1, FL_NEG = 1 << 2 };

/* Memória Mapeada I/O */
enum { MR_KBSR = 0xFE00, MR_KBDR = 0xFE02 };

/* Trap Codes */
enum { TRAP_GETC = 0x20, TRAP_OUT = 0x21, TRAP_PUTS = 0x22, TRAP_IN = 0x23, TRAP_PUTSP = 0x24, TRAP_HALT = 0x25 };

uint16_t memory[UINT16_MAX + 1];
uint16_t reg[R_COUNT];
struct termios original_tio;

void disable_input_buffering() {
    tcgetattr(STDIN_FILENO, &original_tio);
    struct termios new_tio = original_tio;
    new_tio.c_lflag &= ~ICANON & ~ECHO;
    tcsetattr(STDIN_FILENO, TCSANOW, &new_tio);
}

void restore_input_buffering() { tcsetattr(STDIN_FILENO, TCSANOW, &original_tio); }

uint16_t check_key() {
    fd_set readfds; FD_ZERO(&readfds); FD_SET(STDIN_FILENO, &readfds);
    struct timeval timeout = {0, 0};
    return select(1, &readfds, NULL, NULL, &timeout) != 0;
}

void handle_interrupt(int signal) { restore_input_buffering(); printf("\n"); exit(-2); }

uint16_t sign_extend(uint16_t x, int bit_count) {
    if ((x >> (bit_count - 1)) & 1) x |= (0xFFFF << bit_count);
    return x;
}

uint16_t swap16(uint16_t x) { return (x << 8) | (x >> 8); }

void update_flags(uint16_t r) {
    if (reg[r] == 0) reg[R_COND] = FL_ZRO;
    else if (reg[r] >> 15) reg[R_COND] = FL_NEG;
    else reg[R_COND] = FL_POS;
}

int read_image(const char* image_path) {
    FILE* file = fopen(image_path, "rb");
    if (!file) return 0;
    uint16_t origin; fread(&origin, sizeof(origin), 1, file);
    origin = swap16(origin);
    uint16_t max_read = UINT16_MAX - origin + 1;
    size_t read = fread(memory + origin, sizeof(uint16_t), max_read, file);
    while (read-- > 0) { memory[origin] = swap16(memory[origin]); origin++; }
    fclose(file); return 1;
}

uint16_t mem_read(uint16_t address) {
    if (address == MR_KBSR) {
        if (check_key()) { memory[MR_KBSR] = (1 << 15); memory[MR_KBDR] = getchar(); }
        else memory[MR_KBSR] = 0;
    }
    return memory[address];
}

int main(int argc, const char* argv[]) {
    if (argc < 2) { printf("Uso: lc3 [arquivo_imagem]\n"); exit(2); }
    if (!read_image(argv[1])) { printf("Falha ao carregar: %s\n", argv[1]); exit(1); }

    signal(SIGINT, handle_interrupt); disable_input_buffering();
    reg[R_PC] = 0x3000; /* Início padrão */

    int running = 1;
    while (running) {
        uint16_t instr = mem_read(reg[R_PC]++);
        uint16_t op = instr >> 12;

        switch (op) {
            case OP_ADD: {
                uint16_t r0 = (instr >> 9) & 0x7, r1 = (instr >> 6) & 0x7;
                if ((instr >> 5) & 0x1) reg[r0] = reg[r1] + sign_extend(instr & 0x1F, 5);
                else reg[r0] = reg[r1] + reg[instr & 0x7];
                update_flags(r0); break;
            }
            case OP_AND: {
                uint16_t r0 = (instr >> 9) & 0x7, r1 = (instr >> 6) & 0x7;
                if ((instr >> 5) & 0x1) reg[r0] = reg[r1] & sign_extend(instr & 0x1F, 5);
                else reg[r0] = reg[r1] & reg[instr & 0x7];
                update_flags(r0); break;
            }
            case OP_NOT: { uint16_t r0 = (instr >> 9) & 0x7; reg[r0] = ~reg[(instr >> 6) & 0x7]; update_flags(r0); break; }
            case OP_BR: if (((instr >> 9) & 0x7) & reg[R_COND]) reg[R_PC] += sign_extend(instr & 0x1FF, 9); break;
            case OP_JMP: reg[R_PC] = reg[(instr >> 6) & 0x7]; break;
            case OP_JSR: reg[R_R7] = reg[R_PC]; reg[R_PC] = ((instr >> 11) & 0x1) ? reg[R_PC] + sign_extend(instr & 0x7FF, 11) : reg[(instr >> 6) & 0x7]; break;
            case OP_LD: { uint16_t r0 = (instr >> 9) & 0x7; reg[r0] = mem_read(reg[R_PC] + sign_extend(instr & 0x1FF, 9)); update_flags(r0); break; }
            case OP_LDI: { uint16_t r0 = (instr >> 9) & 0x7; reg[r0] = mem_read(mem_read(reg[R_PC] + sign_extend(instr & 0x1FF, 9))); update_flags(r0); break; }
            case OP_LDR: { uint16_t r0 = (instr >> 9) & 0x7; reg[r0] = mem_read(reg[(instr >> 6) & 0x7] + sign_extend(instr & 0x3F, 6)); update_flags(r0); break; }
            case OP_LEA: { uint16_t r0 = (instr >> 9) & 0x7; reg[r0] = reg[R_PC] + sign_extend(instr & 0x1FF, 9); update_flags(r0); break; }
            case OP_ST: memory[reg[R_PC] + sign_extend(instr & 0x1FF, 9)] = reg[(instr >> 9) & 0x7]; break;
            case OP_STI: memory[mem_read(reg[R_PC] + sign_extend(instr & 0x1FF, 9))] = reg[(instr >> 9) & 0x7]; break;
            case OP_STR: memory[reg[(instr >> 6) & 0x7] + sign_extend(instr & 0x3F, 6)] = reg[(instr >> 9) & 0x7]; break;
            case OP_TRAP:
                reg[R_R7] = reg[R_PC];
                switch (instr & 0xFF) {
                    case TRAP_GETC: reg[R_R0] = (uint16_t)getchar(); update_flags(R_R0); break;
                    case TRAP_OUT: putc((char)reg[R_R0], stdout); fflush(stdout); break;
                    case TRAP_PUTS: { uint16_t* c = memory + reg[R_R0]; while (*c) { putc((char)*c, stdout); c++; } fflush(stdout); break; }
                    case TRAP_IN: printf("Digite: "); char c = getchar(); putc(c, stdout); reg[R_R0] = (uint16_t)c; update_flags(R_R0); break;
                    case TRAP_HALT: puts("HALT."); running = 0; break;
                } break;
            default: abort();
        }
    }
    restore_input_buffering(); return 0;
}
